server {
    listen 80;
    listen [::]:80;
    listen 443 ssl http2 reuseport;
    listen [::]:443 http2 reuseport;
    server_name DOMAIN_VPS_ANDA;

    ssl_certificate /etc/xray/xray.crt;
    ssl_certificate_key /etc/xray/xray.key;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+ECDSA+AES128:EECDH+aRSA+AES128:RSA+AES128:EECDH+ECDSA+AES256:EECDH+aRSA+AES256:RSA+AES256:EECDH+ECDSA+3DES:EECDH+aRSA+3DES:RSA+3DES:!MD5;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;

    # WEBSOCKET & HTTP UPGRADE PATHS
    location ~ /vmess|/vless|/trojan|/upvmess|/upvless|/uptrojan {
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        if ($request_uri = "/vmess") { proxy_pass http://127.0.0.1:10001; }
        if ($request_uri = "/vless") { proxy_pass http://127.0.0.1:10004; }
        if ($request_uri = "/trojan") { proxy_pass http://127.0.0.1:10007; }
        if ($request_uri = "/upvmess") { proxy_pass http://127.0.0.1:10003; }
        if ($request_uri = "/upvless") { proxy_pass http://127.0.0.1:10006; }
        if ($request_uri = "/uptrojan") { proxy_pass http://127.0.0.1:10009; }
    }

    # GRPC PATHS
    location ~ /vmess-grpc|/vless-grpc|/trojan-grpc {
        client_max_body_size 0;
        grpc_set_header X-Real-IP $remote_addr;
        
        if ($request_uri = "/vmess-grpc") { grpc_pass grpc://127.0.0.1:10002; }
        if ($request_uri = "/vless-grpc") { grpc_pass grpc://127.0.0.1:10005; }
        if ($request_uri = "/trojan-grpc") { grpc_pass grpc://127.0.0.1:10008; }
    }

    location / {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        return 200 "LBJ Tunneling System Active";
    }
}
